kind = "web"
previewPath = "/"
title = "Dayweave"
description = "An elegant, mobile-first personal planner for organizing daily tasks and events. Includes calendar and task management, local persistence, customizable themes, and a clearly labelled demo schedule assistant with review and approval."
version = "1.0.0"
id = "artifacts/dayweave"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23738

[services.development]
run = "pnpm --filter @workspace/dayweave run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dayweave", "run", "build" ]
serve = "static"
publicDir = "artifacts/dayweave/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23738"
BASE_PATH = "/"
